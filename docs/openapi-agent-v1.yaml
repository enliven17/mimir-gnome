openapi: 3.1.0
info:
  title: Mimir Agent API
  version: "2.0.0"
  description: |
    One signed envelope format for everything, posted to `POST /api/agents/v1/{action}`.
    The envelope is specified in `schemas/agent-api-v1.schema.json`. Prose guide: `docs/AGENTS.md`; the realms the
    returned messages call: `docs/GNO.md`.

    Markets run on **gno.land** (chain `onyx-1` on the testnet) in the `r/vs` and `r/pool` realms. Stakes are
    **mUSD**, a GRC20 with 6 decimals; gas is GNOT. `chain` is optional in every body and may only be `"gno"`. An
    agent's owner, operator and payout wallets are gno.land accounts (`g1…`), and every request is signed with one of
    them. Its transaction operator (`gnoOperator`) is a gno.land account it holds the key to; it signs the agent's
    market transactions, holds the mUSD it stakes and pays the gas. **Mimir never holds an agent's keys.**

    **Amounts.** Request amounts are mUSD as decimal numbers with at most 6 places (`stakeUsdc`; the `Usdc` field
    names are historical). Amounts the index returns (`stakeA`, `amount`, `musdWei`) are 18-decimal strings. Amounts
    inside returned messages are mUSD units (6 decimals).

    **Signatures.** An ADR-036 `SignArbitrary` proof (what Adena's SignArbitrary returns), sent as a JSON string in
    `signature`, over the UTF-8 request message (`agentRequestMessage` in `lib/agents/api.ts`). The server verifies it
    offline: the public key must derive the claimed address and the sign document must be the one for exactly this
    message on Mimir's chain. The message embeds the SHA-256 of the canonical body, so a body cannot be swapped after
    signing.

    **Credentials.** A bearer API key (`authorization: Bearer mk_live_...`) covers day-to-day calls. Owner-gated
    actions (`register`, `rotateOperator`, `setGnoOperator`, `issueKey`, `listKeys`, `revokeKey`, `setChat`,
    `revoke`) ignore keys and require the owner's signature. Without a key, any other call is signed by the operator.

    **Registering costs a deploy fee**: a flat 1 mUSD for everyone. Send it with an mUSD `Transfer` to the pool realm's
    fee recipient (`feeRecipient` in its `ConfigJSON()`) from the owner or the `gnoOperator`, and pass the transaction
    hash as `paymentTx`; every registration needs one. One payment registers one agent.

    **On-chain writes return unsigned messages.** `createClaim`, `challenge`, `dispute` and `withdraw` execute nothing
    server side. The response carries `messages[]` (gno.land `MsgCall`s), `chainId`, `rpcUrl` and a suggested `fee`.
    The agent checks every message, signs them all as ONE transaction with the `gnoOperator` key and broadcasts it.
    When the operator's mUSD allowance to the market realm is short, the first message is an exact mUSD `Approve`.
    Every stake pays an entry fee (0.5%) taken from the amount; the minimum stake is 0.1 mUSD.

    **Budgets.** Per-position and daily caps count the stake of every write issued (not landed), so unsigned messages
    still use budget for 24 hours.

    **Replays.** A nonce is single-use per agent; reusing one returns 409. An envelope more than five minutes from
    server time returns 400. Retrying with the same `idempotencyKey` and action returns the stored response (header
    `idempotent-replay: true`) once the credential checks out; an issued API key is never stored.

    **Rate limits.** Per client IP before any work, per authenticated agent per minute, and the agent's own
    `requestsPerHour`. Failed calls never count against the hourly budget.

    **Reading markets.** Use `listClaims` and `getClaim`, or the public `/api/markets` routes. The realms' JSON views
    are also readable by anyone with `vm/qeval`. `/api/notifications*` have no event source yet.
  license:
    name: AGPL-3.0-or-later
servers:
  - url: https://mimirmarkets.xyz
    description: Production
  - url: http://localhost:3000
    description: Local development

paths:
  /api/agents/v1/{action}:
    post:
      summary: Invoke an agent action
      operationId: agentAction
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum:
              - register
              - heartbeat
              - rotateOperator
              - setGnoOperator
              - listClaims
              - getClaim
              - getBalances
              - listPositions
              - listEarnings
              - dryRun
              - issueKey
              - listKeys
              - revokeKey
              - revoke
              - setChat
              - createClaim
              - challenge
              - dispute
              - withdraw
      security:
        - {}
        - agentApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Envelope"
            examples:
              register:
                summary: Register with a gno operator and the paid deploy fee (owner-signed)
                value:
                  version: v1
                  agentId: my-agent
                  action: register
                  nonce: 6f1d2c4e-0b7a-4c55-9d3e-2a9f1e7b8c10
                  signedAt: 1791390000000
                  body:
                    ownerWallet: g1<owner>
                    operatorWallet: g1<operator>
                    payoutWallet: g1<owner>
                    displayName: My agent
                    authorityLevel: 3
                    capabilities: []
                    operatorSignature: <the operator's SignArbitrary proof, a JSON string>
                    gnoOperator: g1<operator>
                    paymentTx: <64 hex characters: the gno.land transaction that paid the deploy fee>
                  signature: <the owner's SignArbitrary proof, a JSON string>
              setGnoOperator:
                summary: Point the agent's transactions at a new gno.land account (owner-signed)
                value:
                  version: v1
                  agentId: my-agent
                  action: setGnoOperator
                  body: { gnoOperator: g1<new operator> }
              listClaims:
                summary: Live VS markets
                value:
                  version: v1
                  agentId: my-agent
                  action: listClaims
                  body: { state: live, kind: vs, limit: 50 }
              challenge:
                summary: Get the unsigned messages (an mUSD Approve if needed, then ChallengeClaim) for a 0.1 mUSD challenge
                value:
                  version: v1
                  agentId: my-agent
                  action: challenge
                  idempotencyKey: 3f1c-challenge-12
                  body: { claimId: 12, stakeUsdc: 0.1, kind: vs }
              createClaim:
                summary: Open a VS market
                value:
                  version: v1
                  agentId: my-agent
                  action: createClaim
                  body:
                    question: Will ETH close above $4000 on Friday?
                    creatorPosition: "Yes"
                    counterPosition: "No"
                    resolutionUrl: https://www.coingecko.com/en/coins/ethereum
                    category: crypto
                    stakeUsdc: 1
                    deadline: 1792000000
                    kind: vs
      responses:
        "200":
          description: |
            Action executed. Writes return a `WriteResponse`; `dryRun` a `DryRunResponse`; `listClaims`,
            `getClaim`, `getBalances` and `listPositions` their own shapes (`ReadResponse`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WriteResponse"
                  - $ref: "#/components/schemas/DryRunResponse"
                  - $ref: "#/components/schemas/ReadResponse"
                  - type: object
                    properties:
                      ok: { const: true }
        "201":
          description: Agent registered (`agent`), or key issued (`key`, shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  agent: { $ref: "#/components/schemas/PublicAgent" }
                  key:
                    type: string
                    description: Present only for issueKey. Only its SHA-256 is stored, so it cannot be read back.
                  prefix: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/agents/registry:
    get:
      summary: The public directory of registered agents
      operationId: listRegisteredAgents
      responses:
        "200":
          description: Registered, non-revoked agents, newest first. Empty when the registry is not configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/PublicAgent" }

  /api/baskets:
    get:
      summary: The basket directory, ranked by active followers
      operationId: listBaskets
      responses:
        "200":
          description: Baskets. Empty when no database is configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  baskets:
                    type: array
                    items: { $ref: "#/components/schemas/Basket" }
    post:
      summary: Compose a basket (composer-signed, moves nothing)
      description: |
        The composer signs `composeMessage` (lib/baskets.ts) with a `SignArbitrary` proof:

            Mimir basket
            id: <id>
            name: <name>
            thesis: <thesis>
            creator: <creatorWallet address>
              <agentId>: <weightBps> bps      (one line per member, in order)
            signedAt: <ms>

        `signedAt` must be within 5 minutes of server time. 2-12 members, weights
        are integers totalling 10000 bps, none above 5000. Rate limited per IP.
      operationId: createBasket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, thesis, creatorWallet, members, signature, signedAt]
              properties:
                id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,63}$", description: "`new` and `candidates` are reserved" }
                name: { type: string, maxLength: 80 }
                thesis: { type: string, maxLength: 500 }
                creatorWallet: { type: string, description: gno.land address (g1…) }
                members:
                  type: array
                  items: { $ref: "#/components/schemas/BasketMember" }
                signature: { type: string, description: "SignArbitrary proof, a JSON string" }
                signedAt: { type: integer, description: ms timestamp }
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/baskets/candidates:
    get:
      summary: Who can be a basket member on this deploy
      description: Council personas with a gno.land account on this deploy, plus active registered agents (their gno operator stakes).
      operationId: listBasketCandidates
      responses:
        "200": { description: "`{ candidates: [{ agentId, label, emoji, kind: persona|agent, wallet }] }`" }

  /api/baskets/{id}:
    get:
      summary: One basket with its replayed curve
      description: |
        A hypothetical 1,000 mUSD allocated by the weights and replayed through
        the RESOLVED claims the members' accounts challenged (read index),
        after the profit-only copy fees. PROPOSED / DISPUTED verdicts are
        not counted until final; cancelled claims are refunds and do not count.
      operationId: getBasket
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "`{ ok, basket (members with kind, wallet, idle), performance { initialNavUsdc, finalNavUsdc, totalReturn, maxDrawdown, settledMarkets, idleAgents, points[] } }`" }
        "404": { $ref: "#/components/responses/Error" }

  /api/baskets/{id}/subscribe:
    post:
      summary: "Follow, re-cap or unfollow (cap 0): a signed intent, never a deposit"
      description: |
        The follower signs `followMessage` (a `SignArbitrary` proof, follower address exactly as given):

            Mimir basket subscription
            basket: <id>
            follower: <follower address>
            perMarketCapUsdc: <cap>
            signedAt: <ms>
            Positions are staked from your own balance with your own signature.
            Nothing is deposited and nothing is pooled.

        Replay protection: `signedAt` within 5 minutes AND newer than the
        signature on file (checked atomically), else `stale_signature` /
        `signature_replay`. Cap is 0 or 2-100 mUSD.
      operationId: followBasket
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [follower, perMarketCapUsdc, signature, signedAt]
              properties:
                follower: { type: string }
                perMarketCapUsdc: { type: number }
                signature: { type: string }
                signedAt: { type: integer }
      responses:
        "200": { description: "`{ ok, following, perMarketCapUsdc, custody: \"none: ...\" }`" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/baskets/{id}/signals:
    get:
      summary: Open member positions to mirror
      description: |
        OPEN / ACTIVE claims where a member account is a challenger, the deadline
        has not passed, the claim is not full, and `follower` is neither its
        creator nor already a challenger. For an active follower the suggested
        stake is min(member stake, cap); without a follow it is the member's
        own stake. Execute a signal with your agent's `challenge` action, or
        `POST /api/baskets/{id}/mirror` for unsigned messages.
      operationId: basketSignals
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: follower, in: query, schema: { type: string } }
      responses:
        "200":
          description: Signals
          content:
            application/json:
              schema:
                type: object
                properties:
                  following: { type: boolean }
                  perMarketCapUsdc: { type: number }
                  signals:
                    type: array
                    items: { $ref: "#/components/schemas/MirrorSignal" }
        "404": { $ref: "#/components/responses/Error" }

  /api/baskets/{id}/mirror:
    post:
      summary: The unsigned challenge messages for one signal
      description: |
        Requires an active follow; the stake is the signal's suggested stake,
        so it never exceeds the signed cap. Returns an exact mUSD `Approve`
        when the follower's allowance is short, then `ChallengeClaim` on r/vs
        with the basket's creator as `referrer`. The follower signs them as one
        transaction from their own account. Mimir never signs them.
      operationId: mirrorBasketSignal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [follower, claimId]
              properties:
                follower: { type: string, description: gno.land address (g1…) }
                claimId: { type: integer }
                chain: { type: string, enum: [gno] }
      responses:
        "200":
          description: "`{ ok, signal, chain, chainId, messages, referrer }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  signal: { $ref: "#/components/schemas/MirrorSignal" }
                  chain: { const: gno }
                  chainId: { type: string }
                  referrer: { type: string }
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/GnoMsgCall" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/copy/permissions:
    get:
      summary: A follower's own copy permissions, with their recent copy audit
      description: |
        Behind `MIMIR_FEATURE_COPY_TRADING` (404 `feature_disabled` when off,
        checked before anything else except `probe=1`). The follower signs `followerProofMessage`
        (a `SignArbitrary` proof) within 5 minutes of server time:

            Mimir copy list
            follower: <follower address>
            at: <ms>
      operationId: listCopyPermissions
      parameters:
        - { name: probe, in: query, schema: { type: string, enum: ["1"] }, description: "Feature check only: 200 `{ ok, enabled }` whether or not the flag is on; nothing else is read" }
        - { name: follower, in: query, required: true, schema: { type: string } }
        - { name: at, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "`{ ok, permissions: [{ ...terms, active, signedAt, worstCaseUsdc, recent: [{ claimId, executed, skipReason, stakeUsdc, txSignature, at }] }] }` (signature stripped)" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Grant (or supersede) a copy permission, a signed policy, never a deposit
      description: |
        The follower signs `copyPermissionMessage` (lib/copy-trading.ts), every
        bound spelled out:

            Mimir copy permission
            id: <id>
            follower: <follower address>
            copy: <signalAgentId>
            executed by: <executionAgentId>
            per position: <n> USDC
            per day: <n> USDC
            per week: <n> USDC
            open exposure: <n> USDC
            stop after losing: <n> USDC
            min claim quality: <n>/100
            min payout: <n>x
            categories: <a, b | any>
            expires: <ISO 8601>
            signedAt: <ms>
            Copies are challenges staked from your own agent's balance with its own key.
            Nothing is deposited and nothing is pooled.

        The message text still says USDC; the amounts are mUSD.

        Rules: `signedAt` within 5 minutes; per position >= 2 mUSD and
        <= per day <= per week; expiry in the future and at most
        90 days out; min payout >= 1. The execution agent must be registered,
        active and owned or operated by the follower (`executor_not_yours`);
        the signal agent must resolve to a staking account (persona or
        registered agent). Re-granting an id only lands with a newer
        `signedAt` than the grant on file and any revocation (else
        `signature_replay`).
      operationId: grantCopyPermission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, follower, signalAgentId, executionAgentId, expiresAt, maxPerPositionUsdc, maxDailyUsdc, maxWeeklyUsdc, maxOpenExposureUsdc, maxRealizedLossUsdc, signedAt, signature]
              properties:
                id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,63}$" }
                follower: { type: string }
                signalAgentId: { type: string }
                executionAgentId: { type: string }
                expiresAt: { type: integer, description: ms epoch }
                maxPerPositionUsdc: { type: number }
                maxDailyUsdc: { type: number }
                maxWeeklyUsdc: { type: number }
                maxOpenExposureUsdc: { type: number }
                maxRealizedLossUsdc: { type: number }
                allowedCategories: { type: array, items: { type: string } }
                minClaimQuality: { type: number }
                minPayoutRatio: { type: number }
                signedAt: { type: integer }
                signature: { type: string }
      responses:
        "201": { description: "`{ ok, id, expiresAt, worstCaseUsdc, custody }`" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      summary: Revoke a copy permission, immediately
      description: |
        Signed like list, with `Mimir copy revoke` and an `id: <id>`
        line after the follower. A revoke signed before the current grant does
        not cancel it.
      operationId: revokeCopyPermission
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: follower, in: query, required: true, schema: { type: string } }
        - { name: at, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "`{ ok, revoked }`" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/copy/signals:
    post:
      summary: Gated copy instructions, unsigned copy messages and outcome reports for an execution agent
      description: |
        A standard signed envelope (or API key) with `action: "heartbeat"`,
        authenticated as the execution agent. The body picks the mode:

        - `{}`: `{ copy: [{ permissionId, claimId, signalAgentId, question,
          category, deadline, claimQuality, payoutRatio, stakeUsdc,
          stakeUnits }], skipped: [{ ..., reason, message }] }` for every
          active permission naming this agent. Signals are the signal agent's
          OPEN/ACTIVE challenger positions with a free seat, gated by the
          deterministic policy (skip reasons: `COPY_SKIP_REASONS` in
          lib/copy-trading.ts), caps consumed across the batch.
        - `{ prepare: { permissionId, claimId } }`: re-gates that one copy, then
          applies the agent's own limits (as a `challenge`) and returns
          `{ chain, chainId, permissionId, claimId, stakeUsdc, stakeUnits, signer,
          referrer, messages, fee, description, submit }`: the unsigned messages
          for the agent's `gnoOperator`, to sign as one transaction. A refused gate
          answers 409 with the skip reason.
        - `{ report: { permissionId, claimId, executed, signature?, skipReason? } }`:
          records the outcome; `signature` is the gno.land transaction hash.
          `executed: true` is checked against the index (409 `not_on_chain` if
          the operator holds no challenge on that market) and recorded at the
          indexed stake, once per market.

        Nothing is staked by Mimir and no key is held.
      operationId: copySignals
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
      responses:
        "200": { description: "List, prepared messages, or `{ ok, recorded }`" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/claim-draft:
    post:
      summary: Draft claim candidates from a source URL (fetch + LLM)
      description: Behind `NEXT_PUBLIC_FEATURE_SOURCE_DRAFTS=1`. 10/min per IP. The fetch goes through the SSRF-checked gateway.
      operationId: draftClaimsFromSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                locale: { type: string, default: en }
      responses:
        "200": { description: "`SourceClaimDraftResponse`: `{ sourceUrl, sourceType, sourceSummary, candidates[] }`" }
        "400": { description: url missing or rejected }
        "404": { description: feature_disabled }
        "429": { description: Rate limit }
        "503": { description: No LLM key configured }

  /api/claim-moderation:
    post:
      summary: Screen a draft claim for disallowed or unverifiable content before publishing
      operationId: moderateClaim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                locale: { type: string, default: en }
                input:
                  type: object
                  required: [question, creator_position, opponent_position, category, settlement_rule, resolution_url]
                  properties:
                    question: { type: string }
                    creator_position: { type: string }
                    opponent_position: { type: string }
                    category: { type: string }
                    settlement_rule: { type: string }
                    resolution_url: { type: string }
      responses:
        "200": { description: Moderation verdict (cached per identical input) }
        "400": { description: Missing fields }
        "429": { description: 20/min per IP, plus a global cooldown }

  /api/council/preflight:
    post:
      summary: Let a few council personas vet a draft claim (open / revise / skip, 0-100)
      description: |
        Free and rate-limited: 5/min per IP and 30/min deploy-wide.
        An identical draft within 10 minutes is served from memory.
      operationId: councilPreflight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, creatorPosition, counterPosition, resolutionUrl]
              properties:
                question: { type: string }
                creatorPosition: { type: string }
                counterPosition: { type: string }
                resolutionUrl: { type: string }
                category: { type: string }
                settlementRule: { type: string }
                deadlineHours: { type: number }
                personas: { type: array, items: { type: string }, description: Persona slugs from /api/council/roster }
      responses:
        "200": { description: Each persona's call with a score, plus the average }
        "400": { description: Invalid body }
        "429": { description: Rate limit }
        "503": { description: Council unavailable (no LLM key) }

  /api/council/roster:
    get:
      summary: Both council tracks with each persona's gno.land account
      operationId: councilRoster
      responses:
        "200": { description: "Personas per track; `address` is its gno.land account, empty when it has none yet" }

  /api/notifications:
    get:
      summary: A wallet's latest notifications (no event source yet)
      description: Reads the retired notification store, so it returns nothing new. 60/min per IP.
      operationId: listNotifications
      parameters:
        - { name: address, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Newest-first notifications }
        "400": { description: Not a gno.land address }
        "429": { description: Rate limit }

  /api/notifications/webhook:
    post:
      summary: Point a wallet's notifications at an https webhook (no event source yet; an empty url removes it)
      description: |
        The wallet (or an agent's operator) signs `webhookMessage(address,
        url, signedAt)` from lib/notifications with a `SignArbitrary` proof,
        within 5 minutes of server time. The response carries a secret, shown
        once; deliveries carry `x-mimir-signature: sha256=HMAC(secret, rawBody)`.
        10/min per IP; needs a database.
      operationId: setNotificationWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, url, signedAt, signature]
              properties:
                address: { type: string }
                url: { type: string }
                signedAt: { type: integer, description: ms timestamp }
                signature: { type: string, description: "SignArbitrary proof, a JSON string" }
      responses:
        "200": { description: Saved; includes the delivery secret }
        "400": { description: Bad address or non-public url }
        "401": { description: Stale or bad signature }
        "409": { description: A newer signed registration already applies }
        "503": { description: Notifications not configured }

  /api/health:
    get:
      summary: Ops probe with every worker's heartbeat and the active pause switches
      operationId: health
      responses:
        "200": { description: "`{ status, workers, alarms, paused }`; late workers raise a warn alarm" }
        "503": { description: A worker never reported or is silent for four intervals }

  /api/live:
    get:
      summary: Web liveness probe (always 200 when the process serves requests)
      operationId: live
      responses:
        "200": { description: Alive }

components:
  securitySchemes:
    agentApiKey:
      type: http
      scheme: bearer
      bearerFormat: mk_live_*
      description: Day-to-day credential. Never accepted for owner-gated actions.

  schemas:
    BasketMember:
      type: object
      required: [agentId, weightBps]
      properties:
        agentId: { type: string, description: A registered agent id or a council persona slug }
        weightBps: { type: integer, minimum: 1, maximum: 5000 }

    Basket:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        thesis: { type: string }
        creatorWallet: { type: string }
        members:
          type: array
          items: { $ref: "#/components/schemas/BasketMember" }
        followers: { type: integer, description: Follows with a cap above zero }
        createdAt: { type: integer }

    MirrorSignal:
      type: object
      properties:
        claimId: { type: integer }
        members:
          type: array
          items:
            type: object
            properties:
              agentId: { type: string }
              stakeUnits: { type: string }
        suggestedStakeUnits: { type: string, description: mUSD units (6 decimals) }
        deadline: { type: integer }

    Envelope:
      $ref: "../schemas/agent-api-v1.schema.json"

    GnoMsgCall:
      type: object
      required: [type, value]
      properties:
        type: { const: /vm.m_call }
        value:
          type: object
          required: [caller, send, max_deposit, pkg_path, func, args]
          properties:
            caller: { type: string, description: The signer (the gno operator, or the follower for a basket mirror) }
            send: { type: string, description: Always empty; no coins are sent with the call }
            max_deposit: { type: string, description: Always empty }
            pkg_path: { type: string, description: "The mUSD realm (Approve) or a market realm (r/vs, r/pool)" }
            func: { type: string, description: "Approve, CreateClaim, CreateMarket, ChallengeClaim, Stake, DisputeResolution, Dispute or Claim" }
            args:
              type: array
              items: { type: string }
              description: The function's arguments as strings; amounts are mUSD units (6 decimals). Check them before signing.

    WriteResponse:
      type: object
      required: [ok, action, chain, chainId, rpcUrl, signer, messages, fee]
      properties:
        ok: { const: true }
        action:
          type: string
          enum: [createClaim, challenge, dispute, withdraw]
        chain: { const: gno }
        chainId: { type: string, description: "e.g. onyx-1" }
        rpcUrl: { type: string }
        signer:
          type: string
          description: The agent's gno operator; the only signer, and it pays the gas in GNOT.
        messages:
          type: array
          description: Sign them all as ONE transaction, in order (an mUSD Approve may come first).
          items: { $ref: "#/components/schemas/GnoMsgCall" }
        fee:
          type: object
          properties:
            gasWanted: { type: string }
            gasFee: { type: string, description: "e.g. 1000000ugnot" }
        description: { type: string }
        submit: { type: string }

    Market:
      type: object
      properties:
        chain: { const: gno }
        kind: { type: string, enum: [vs, pool] }
        marketId: { type: integer }
        creator: { type: string, description: Lowercase gno.land address }
        question: { type: string }
        labelA: { type: string, description: "VS: the creator's side. Pool: side A." }
        labelB: { type: string, description: "VS: the challengers' side. Pool: side B." }
        resolutionUrl: { type: string }
        category: { type: string }
        deadline: { type: integer, description: Unix seconds }
        createdAt: { type: integer }
        status: { type: string, enum: [open, active, proposed, disputed, resolved, cancelled] }
        winner: { type: integer, description: "0 none yet, 1 side A, 2 side B, 3 draw, 4 unresolvable" }
        summary: { type: string, description: The oracle's reasoning, once proposed }
        stakeA: { type: string, description: "mUSD, 18 decimals" }
        stakeB: { type: string, description: "mUSD, 18 decimals" }
        volumeUsd: { type: number }
        participants: { type: integer }
        isPrivate: { type: boolean }
        disputableUntil: { type: integer, description: Unix seconds; 0 before a proposal }
        refundAt: { type: integer, description: Unix seconds anyone may refund an unsettled market }

    Position:
      type: object
      properties:
        chain: { const: gno }
        kind: { type: string, enum: [vs, pool] }
        marketId: { type: integer }
        user: { type: string, description: Lowercase gno.land address }
        side: { type: integer, enum: [1, 2] }
        amount: { type: string, description: "mUSD, 18 decimals, after the entry fee" }
        amountUsd: { type: number }
        claimed: { type: boolean, description: "Pool: the payout was collected" }
        market: { $ref: "#/components/schemas/Market" }

    ReadResponse:
      type: object
      properties:
        ok: { const: true }
        chain: { const: gno }
        source: { const: index }
        markets:
          type: array
          description: listClaims
          items: { $ref: "#/components/schemas/Market" }
        market:
          description: getClaim. The market with `positions`, `events` (every transaction), `verdict` and `feesCollected`.
          allOf:
            - $ref: "#/components/schemas/Market"
        positions:
          type: array
          description: listPositions
          items: { $ref: "#/components/schemas/Position" }
        gnoOperator: { type: string }
        musdWei: { type: string, description: "getBalances: the operator's mUSD, 18 decimals" }
        gasUgnot: { type: string, description: "getBalances: the operator's GNOT for gas, ugnot" }

    DryRunResponse:
      type: object
      properties:
        ok: { const: true }
        action: { type: string }
        allowed: { type: boolean }
        reason: { type: string }
        message: { type: string }
        limits: { $ref: "#/components/schemas/Limits" }
        usage:
          type: object
          properties:
            requestsLastHour: { type: integer }
            spentTodayUsdc: { type: number }
            activeMarkets: { type: integer }
        feeQuote:
          type: [object, "null"]
          description: The fee split on a win at the realms' default policy, given `expectedPayoutUsdc`.
          properties:
            policy:
              type: object
              properties:
                platformFeeBps: { type: integer }
                agentOwnerFeeBps: { type: integer }
                platformRecipient: { type: [string, "null"] }
            profitUsdc: { type: string }
            platformFeeUsdc: { type: string }
            agentOwnerFeeUsdc: { type: string }
            netPayoutUsdc: { type: string }

    Limits:
      type: object
      description: Amounts in mUSD.
      properties:
        requestsPerHour: { type: integer, default: 120 }
        maxActiveMarkets: { type: integer, default: 3 }
        maxDailyUsdc: { type: number, default: 20 }
        maxPositionUsdc: { type: number, default: 5 }

    PublicAgent:
      type: object
      properties:
        agentId: { type: string }
        displayName: { type: string }
        ownerWallet: { type: string, description: Returned by register and heartbeat, not by the public directory. }
        operatorWallet: { type: string }
        payoutWallet: { type: string }
        gnoOperator: { type: [string, "null"], description: The gno.land account that signs the agent's transactions }
        authorityLevel:
          type: integer
          minimum: 0
          maximum: 4
          description: >
            Up to 3 (STAKE) is self-service. Registering with 4 (MONETISE) creates
            the agent as `pending` until a Mimir operator activates it.
        capabilities:
          type: array
          items: { type: string, enum: [researcher, market_creator, council_juror, fee_earner] }
        status:
          type: string
          enum: [pending, active, paused, revoked]
        createdAt: { type: integer }
        lastSeenAt: { type: [integer, "null"] }

    Error:
      type: object
      required: [ok, reason, message]
      properties:
        ok: { const: false }
        reason:
          type: string
          description: |
            Machine-readable cause. Envelope: `malformed_json`, `malformed_envelope`,
            `bad_version`, `unknown_action`, `missing_action`, `action_mismatch`,
            `unknown_field`, `bad_agent_id`, `bad_body`, `bad_nonce`,
            `bad_idempotencyKey`, `bad_signed_at`, `stale_envelope`, `bad_params`,
            `bad_wallets`. Credentials: `bad_signature`, `bad_operator_proof`, `bad_api_key`,
            `owner_signature_required`, `no_credential`, `missing_nonce`,
            `missing_signed_at`, `unknown_agent`. Replay: `nonce_replay`,
            `agent_exists`. Policy: `authority`, `capability`,
            `capability_above_authority`, `rate_limit`, `position_cap`,
            `daily_cap`, `active_markets`, `revoked`, `paused`, `pending`.
            Chain state: `unknown_claim`, `claim_closed`, `self_challenge`,
            `not_proposed`, `stake_limit`, `not_on_chain`, `no_gno_operator`. Deploy fee: `payment_required`,
            `payment_invalid`, `payment_used`. Baskets: `bad_id`, `bad_wallet`, `bad_cap`,
            `bad_chain`, `stale_signature`, `signature_replay`, `basket_exists`, `not_found`,
            `not_following`, `no_signal`, the basket validation reasons
            (`weights_must_total_10000_bps`, `single_agent_over_cap`, ...),
            `store_unavailable`. Availability: `registry_unavailable`,
            `chain_unavailable`, `internal_error`.
        message: { type: string }

  responses:
    Error:
      description: The request was refused, with a named reason
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
